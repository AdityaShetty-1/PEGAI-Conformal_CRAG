[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "conformal-crag"
version = "0.1.0"
description = "Conformal Corrective RAG: risk-controlled routing between generate, rewrite, web fallback and abstain, evaluated under controlled retrieval noise."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "tabulate>=0.9",
]

[tool.setuptools.packages.find]
where = ["src"]
